<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion Quotes - Joseph Yi</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html">Joseph Yi</a>
            </div>
            <div class="nav-menu" id="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="orion-quotes.html" class="nav-link active">Orion Quotes</a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
            <div class="nav-toggle" id="nav-toggle">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <section class="quotes-page">
        <div class="container">
            <h2 class="section-title">Orion Quotes</h2>
            <p class="section-intro">A random dose of wisdom from the stars.</p>

            <div class="quote-display">
                <blockquote class="quote-text" id="quote-text">Loading&hellip;</blockquote>
            </div>

            <div class="quote-actions">
                <button class="btn btn-primary" id="new-quote-btn">
                    <i class="fas fa-shuffle"></i> New Quote
                </button>
                <button class="btn btn-secondary" id="show-all-btn">
                    <i class="fas fa-list"></i> Show All Quotes
                </button>
            </div>

            <div class="all-quotes-container" id="all-quotes" style="display: none;">
                <h3>All Quotes</h3>
                <ul class="quotes-list" id="quotes-list"></ul>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; 2026 Joseph Yi</p>
            </div>
        </div>
    </footer>

    <script>
    (function () {
        // Theme
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = themeToggle.querySelector('i');
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        themeIcon.className = currentTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';

        themeToggle.addEventListener('click', () => {
            const now = document.documentElement.getAttribute('data-theme');
            const next = now === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            themeIcon.className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        });

        // Mobile nav
        const navToggle = document.getElementById('nav-toggle');
        const navMenu = document.getElementById('nav-menu');
        navToggle.addEventListener('click', () => {
            navMenu.classList.toggle('active');
            navToggle.classList.toggle('active');
        });

        // Quotes
        let quotes = [];
        const quoteText = document.getElementById('quote-text');
        const newQuoteBtn = document.getElementById('new-quote-btn');
        const showAllBtn = document.getElementById('show-all-btn');
        const allQuotesEl = document.getElementById('all-quotes');
        const quotesListEl = document.getElementById('quotes-list');

        function showRandom() {
            if (!quotes.length) return;
            const idx = Math.floor(Math.random() * quotes.length);
            quoteText.classList.remove('animating');
            void quoteText.offsetWidth;
            quoteText.textContent = quotes[idx];
            quoteText.classList.add('animating');
        }

        function renderAll() {
            quotesListEl.innerHTML = '';
            quotes.forEach(q => {
                const li = document.createElement('li');
                li.textContent = q;
                quotesListEl.appendChild(li);
            });
        }

        newQuoteBtn.addEventListener('click', showRandom);

        showAllBtn.addEventListener('click', () => {
            const visible = allQuotesEl.style.display !== 'none';
            allQuotesEl.style.display = visible ? 'none' : 'block';
            showAllBtn.innerHTML = visible
                ? '<i class="fas fa-list"></i> Show All Quotes'
                : '<i class="fas fa-eye-slash"></i> Hide All Quotes';
        });

        fetch('orion-quotes.txt')
            .then(r => r.text())
            .then(text => {
                quotes = text.split('\n').map(l => l.trim()).filter(Boolean);
                if (!quotes.length) {
                    quoteText.textContent = 'No quotes found. Add some to orion-quotes.txt!';
                    return;
                }
                showRandom();
                renderAll();
            })
            .catch(() => {
                quoteText.textContent = 'Could not load quotes.';
            });

        // Fade-in on load
        window.addEventListener('load', () => document.body.classList.add('loaded'));
        const s = document.createElement('style');
        s.textContent = 'body{opacity:0;transition:opacity .5s ease-in}body.loaded{opacity:1}';
        document.head.appendChild(s);
    })();
    </script>
</body>
</html>
